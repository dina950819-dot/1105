<!DOCTYPE html>
<!-- ↑ 告訴瀏覽器：這是一份 HTML5 文件（永遠放第一行） -->
<!-- 整份文件的最外層；lang="zh-Hant" = 繁體中文 -->
<html lang="zh-Hant">
<!-- ===== head：給瀏覽器看的設定，不會顯示在畫面上 ===== -->
<head>
  <!-- 文字編碼用 UTF-8，中文和 emoji 才不會變亂碼 -->
  <meta charset="UTF-8">
  <!-- 讓手機用正常大小顯示網頁 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ✏️ 改這裡：瀏覽器分頁上顯示的標題 -->
  <title>YUJIE的網路名片</title>
  <!-- 借穿的衣服（W3 你會自己做）。這行先不要動！ -->
  <link rel="stylesheet" href="theme.css">
</head>
<!-- ===== body：從這裡開始，才是畫面上看得到的內容 ===== -->

<!-- ✏️ 改這裡：換主題！可以填 theme-neon、theme-notebook、theme-minimal -->
<body class="theme-neon">

  <!-- ✏️ 改這裡：把 images/avatar.svg 換成你的照片，例如 images/me.jpg -->
  <img src="images/DSC03219.jpg" alt="YUJIE的大頭貼">

  <!-- ✏️ 改這裡：你的名字（整頁最重要的標題只能有一個 h1） -->
  <h1>嗨，我是YUJIE 👋</h1>
  <p>資訊傳播系三年級 ｜ <em>正在學寫網頁的新手村村民</em></p>

  <hr>

  <h2>🙋 關於我</h2>
  <!-- ✏️ 改這裡：用 2～3 句話介紹自己，<strong> 包住你想強調的字 -->
  <p>來自<strong>台北</strong>，過去是藝術設計系。<br>
     最近的目標是：<strong>學會更多網頁工具</strong>！</p>

  <h2>💖 我喜歡的東西</h2>
  <!-- ✏️ 改這裡：寫下你的興趣，一行一個 -->
  <p>🧋 無糖的各種拿鐵</p>
  <p>🎮 週末跟朋友粗企玩</p>
  <p>📷 旅遊and到處走走拍拍!</p>

  <h2>🎯 這學期想完成的事</h2>
  <p>知道各種工具如何使用，如何<em>組合</em>。</p>

  <hr>

  <h2>📮 找到我</h2>
  <!-- ✏️ 改這裡：換成你自己的網址（不想公開也可以先放學校網站） -->
  <p>
    <a href="https://www.instagram.com/osibal_08/" target="_blank">Instagram</a> ・
    <a href="https://github.com/" target="_blank">GitHub</a>
  </p>
  <!-- 頁尾小字：small 用來放版權、附註 -->
  <p><small>© 2026 YUJIE ・ 用 HTML 親手做的第一個網頁</small></p>

<!-- body 結束；先關 body，再關 html -->

</body>
</html>
